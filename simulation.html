<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulation Pro - GoMoney</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
body{font-family:'Plus Jakarta Sans',sans-serif;background-color:#0b0f1a;color:#f8fafc}
.glass{background:rgba(30,41,59,.4);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08)}
.slider{width:100%;height:6px;background:#1e293b;border-radius:5px;outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;background:#3b82f6;cursor:pointer;border-radius:50%;border:4px solid #0b0f1a;box-shadow:0 0 15px rgba(59,130,246,.5)}
.input-card{background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.05);transition:.3s}
.input-card:focus-within{border-color:#3b82f6;box-shadow:0 0 20px rgba(59,130,246,.1)}
</style>
</head>
<body class="antialiased min-h-screen flex flex-col">

<nav class="w-full z-50 px-6 py-6">
<div class="max-w-7xl mx-auto flex justify-between items-center glass px-8 py-4 rounded-[2rem] shadow-2xl">
<h1 class="text-2xl font-extrabold tracking-tighter uppercase italic">GO<span class="text-blue-500">MONEY</span></h1>
<div class="hidden md:flex items-center gap-10 text-xs font-bold text-slate-400 uppercase tracking-[0.2em]">
<a href="#" class="hover:text-blue-500 transition">Accueil</a>
<a href="simulation.html" class="text-blue-500">Simulation</a>
<a href="#" class="hover:text-blue-500 transition">Contact</a>
</div>
<div class="w-10 h-10 bg-slate-800 rounded-full flex items-center justify-center border border-white/10">
<i class="fa-solid fa-user text-xs text-blue-500"></i>
</div>
</div>
</nav>

<main class="flex-grow flex items-center justify-center px-6 py-10">
<div class="max-w-3xl w-full">
<div class="text-center mb-12">
<h2 class="text-4xl md:text-5xl font-black text-white mb-4 tracking-tighter">
Votre Prêt sur <span class="text-blue-500 italic">Mesure</span>
</h2>
<p class="text-slate-500 font-medium uppercase tracking-[0.3em] text-xs">
Configurez les paramètres ci-dessous
</p>
</div>

<form id="loanForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">

<div class="input-card p-6 rounded-[2rem] md:col-span-2">
<div class="flex justify-between items-end mb-6">
<div>
<p class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-1">Revenu Mensuel</p>
<h4 class="text-slate-300 font-bold">Votre Salaire</h4>
</div>
<div class="text-right">
<span id="salaryVal" class="text-3xl font-black text-white italic">5,000</span>
<span class="text-blue-500 font-bold ml-1">MAD</span>
</div>
</div>
<input type="range" id="salary" min="2000" max="100000" step="500" value="5000" class="slider" title="Revenu Mensuel">
</div>

<div class="input-card p-6 rounded-[2rem] md:col-span-2">
<label class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-4 block">
Type de financement
</label>
<div class="relative">
<select id="loanType" required title="Type de financement" class="w-full bg-slate-900 text-white rounded-2xl px-6 py-4 appearance-none focus:ring-2 focus:ring-blue-500 font-bold">
<option value="">Sélectionnez un type</option>
<option value="Personnel">Prêt Personnel (9%)</option>
<option value="Maison">Prêt Immobilier (4%)</option>
<option value="Appartement">Prêt Appartement (4.5%)</option>
<option value="Terrain">Achat de Terrain (5.5%)</option>
<option value="Petite entreprise">Crédit Entreprise (7%)</option>
</select>
<i class="fa-solid fa-chevron-down absolute right-6 top-1/2 -translate-y-1/2 text-blue-500 pointer-events-none"></i>
</div>
</div>

<div class="input-card p-6 rounded-[2rem]">
<p class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-4 italic">
Montant Souhaité
</p>
<div class="mb-6">
<span id="loanAmountVal" class="text-3xl font-black text-white italic">50,000</span>
<span class="text-slate-500 font-bold ml-1">MAD</span>
</div>
<input type="range" id="loanAmount" min="5000" max="2000000" step="5000" value="50000" class="slider" title="Montant Souhaité">
</div>

<div class="input-card p-6 rounded-[2rem]">
<p class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-4 italic">
Durée de remboursement
</p>
<div class="mb-6">
<span id="loanTermVal" class="text-3xl font-black text-white italic">5</span>
<span class="text-slate-500 font-bold ml-1">ANS</span>
</div>
<input type="range" id="loanTerm" min="1" max="30" step="1" value="5" class="slider" title="Durée de remboursement">
</div>

<button type="submit" class="md:col-span-2 bg-blue-600 hover:bg-blue-500 text-white font-black py-6 rounded-[2rem] uppercase tracking-[0.3em] transition transform hover:scale-[1.02] shadow-2xl shadow-blue-500/20 mt-4 flex items-center justify-center gap-4">
<i class="fa-solid fa-bolt-lightning"></i>
Calculer ma mensualité
</button>

</form>
</div>
</main>

<script>
const formatNumber=n=>Number(n).toLocaleString('fr-FR');

const setupSlider=id=>{
const input=document.getElementById(id);
const display=document.getElementById(id+'Val');
display.textContent=formatNumber(input.value);
input.addEventListener('input',()=>{
display.textContent=formatNumber(input.value);
});
};

['salary','loanAmount','loanTerm'].forEach(setupSlider);

document.getElementById("loanForm").addEventListener("submit",function(e){
e.preventDefault();

const salaire=parseFloat(document.getElementById('salary').value);
const type=document.getElementById('loanType').value;
const montant=parseFloat(document.getElementById('loanAmount').value);
const duree=parseFloat(document.getElementById('loanTerm').value);

const tauxMap={
'Personnel':0.09,
'Maison':0.04,
'Appartement':0.045,
'Terrain':0.055,
'Petite entreprise':0.07
};

if(!tauxMap[type]){
alert("Veuillez sélectionner un type de financement");
return;
}

const tauxInteret=tauxMap[type];
const i=tauxInteret/12;
const n=duree*12;

let mensualite;

if(i===0){
mensualite=montant/n;
}else{
mensualite=(montant*i)/(1-Math.pow(1+i,-n));
}

const ratioEndettement=(mensualite/salaire)*100;
const decision=ratioEndettement<=40?"accepté":"refusé";

localStorage.setItem("loanData",JSON.stringify({
type,
duree,
mensualite:mensualite.toFixed(2),
decision,
montant,
taux:(tauxInteret*100).toFixed(1),
ratio:ratioEndettement.toFixed(1)
}));

window.location.href="result.html";
});
</script>

</body>
</html>
