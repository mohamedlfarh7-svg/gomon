<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résultat Simulation - GoMoney</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f1a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .result-card { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid rgba(59, 130, 246, 0.2); }
        .status-accepted { color: #10b981; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); }
        .status-refused { color: #ef4444; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="w-full z-50 px-6 py-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center glass px-8 py-4 rounded-[2rem] shadow-2xl">
            <h1 class="text-2xl font-extrabold tracking-tighter uppercase italic">GO<span class="text-blue-500">MONEY</span></h1>
            <div class="hidden md:flex items-center gap-10 text-xs font-bold text-slate-400 uppercase tracking-[0.2em]">
                <a href="index.html" class="hover:text-blue-500 transition">Accueil</a>
                <a href="simulation.html" class="hover:text-blue-500 transition">Simulation</a>
                <a href="contct.html" class="hover:text-blue-500 transition">Contact</a>
            </div>
            <button id="menu-btn" class="md:hidden text-white" title="Ouvrir le menu"><i class="fa-solid fa-bars-staggered"></i></button>
        </div>
    </nav>

    <!-- Result Content -->
    <main class="flex-grow flex items-center justify-center px-6 py-12">
        <div class="max-w-xl w-full">
            <div class="text-center mb-10">
                <h2 class="text-4xl font-black text-white mb-2 tracking-tighter uppercase">Analyse de <span class="text-blue-500">Dossier</span></h2>
                <p class="text-slate-500 font-bold uppercase tracking-[0.3em] text-[10px]">Résultats générés instantanément</p>
            </div>

            <div id="result" class="result-card p-10 rounded-[3rem] shadow-2xl relative overflow-hidden">
                <!-- Status Icon background decoration -->
                <div id="statusIconBg" class="absolute -top-10 -right-10 text-[12rem] opacity-5"></div>
                
                <div class="relative z-10 space-y-8">
                    <!-- Status Badge -->
                    <div id="decisionBadge" class="inline-flex items-center gap-2 px-6 py-2 rounded-full text-xs font-black uppercase tracking-widest mx-auto lg:mx-0">
                        <i id="decisionIcon"></i>
                        <span id="decisionLabel">Analyse en cours...</span>
                    </div>

                    <!-- Main Data Display -->
                    <div class="grid grid-cols-2 gap-8 border-y border-white/5 py-8">
                        <div>
                            <p class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-1">Mensualité</p>
                            <h3 class="text-3xl font-black text-white italic"><span id="resMensualite">0.00</span> <span class="text-sm text-slate-500 not-italic">DH</span></h3>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-1">Type de Prêt</p>
                            <h3 id="resType" class="text-xl font-bold text-slate-200">--</h3>
                        </div>
                    </div>

                    <!-- Details List -->
                    <div class="space-y-4">
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-slate-500 font-bold uppercase tracking-widest text-[10px]">Durée du crédit</span>
                            <span class="text-white font-black"><span id="resDuree">0</span> ANS</span>
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-slate-500 font-bold uppercase tracking-widest text-[10px]">Taux d'intérêt</span>
                            <span class="text-blue-500 font-black"><span id="resTaux">0</span>%</span>
                        </div>
                        <div class="flex justify-between items-center text-sm border-t border-white/5 pt-4">
                            <span class="text-slate-500 font-bold uppercase tracking-widest text-[10px]">Revenu déclaré</span>
                            <span class="text-white font-black"><span id="resSalaire">0</span> DH</span>
                        </div>
                    </div>

                    <!-- CTA Button -->
                    <div class="pt-6">
                        <a href="simulation.html" class="block w-full bg-slate-800 hover:bg-slate-700 text-white text-center py-5 rounded-2xl font-black uppercase tracking-widest text-xs transition border border-white/10 shadow-xl">
                            <i class="fa-solid fa-rotate-left mr-2"></i> Nouvelle Simulation
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-10 text-center opacity-30 text-[10px] font-bold tracking-[0.5em] uppercase">
        © 2024 GoMoney - Digital Experience
    </footer>

<script>
const data = JSON.parse(localStorage.getItem("loanData"));

if (!data) {
    window.location.href = "simulation.html";
}

document.getElementById("resType").innerText = data.type;
document.getElementById("resDuree").innerText = data.duree;
document.getElementById("resTaux").innerText = data.taux;
document.getElementById("resMensualite").innerText = Number(data.mensualite).toLocaleString('fr-FR');
document.getElementById("resSalaire").innerText = data.salaire ? Number(data.salaire).toLocaleString('fr-FR') : "--";

const badge = document.getElementById("decisionBadge");
const label = document.getElementById("decisionLabel");
const icon = document.getElementById("decisionIcon");
const iconBg = document.getElementById("statusIconBg");

if (data.decision === "accepté") {
    badge.classList.add("status-accepted");
    label.innerText = "Dossier Accepté";
    icon.className = "fa-solid fa-circle-check";
    iconBg.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
    iconBg.style.color = "#10b981";
} else {
    badge.classList.add("status-refused");
    label.innerText = "Dossier Refusé";
    icon.className = "fa-solid fa-circle-xmark";
    iconBg.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
    iconBg.style.color = "#ef4444";
}
</script>
</body>
</html>
