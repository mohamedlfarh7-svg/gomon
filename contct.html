<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Premium - GoMoney</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f1a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .input-field { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; }
        .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); outline: none; }
        .hero-glow { background: radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.1) 0%, transparent 70%); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Header / Navigation -->
    <header class="w-full z-50 px-6 py-6">
        <nav class="max-w-7xl mx-auto flex justify-between items-center glass px-8 py-4 rounded-[2rem] shadow-2xl">
            <h1 id="logo" class="text-2xl font-extrabold tracking-tighter uppercase italic text-white">GO<span class="text-blue-500">MONEY</span></h1>
            <div class="hidden md:flex items-center gap-10 text-sm font-bold text-slate-400 uppercase tracking-widest">
                <a href="index.html" class="hover:text-blue-400 transition">Accueil</a>
                <a href="simulation.html" class="hover:text-blue-400 transition">Simulation</a>
                <a href="contct.html" class="text-blue-500">Contact</a>
                <a href="Aide.html" class="hover:text-blue-400 transition">Aide / FAQ</a>
            </div>
            <button id="menu-btn" class="md:hidden text-white text-2xl" title="Ouvrir le menu"><i class="fa-solid fa-bars-staggered"></i></button>
        </nav>

        <!-- Mobile Menu (Hidden by default) -->
        <div id="menu" class="hidden fixed inset-0 bg-[#0b0f1a] z-50 flex flex-col items-center justify-center gap-8 text-2xl font-bold">
            <button id="close-btn" class="absolute top-10 right-10 text-4xl text-white">&times;</button>
            <a href="index.html" class="hover:text-blue-500 transition">Accueil</a>
            <a href="simulation.html" class="hover:text-blue-500 transition">Simulation</a>
            <a href="contct.html" class="text-blue-500">Contact</a>
            <a href="Aide.html" class="hover:text-blue-500 transition">Aide / FAQ</a>
        </div>
    </header>

    <!-- Contact Content -->
    <main class="flex-grow flex items-center justify-center px-6 py-12 relative overflow-hidden">
        <div class="absolute inset-0 hero-glow"></div>
        
        <div class="max-w-4xl w-full grid md:grid-cols-2 gap-12 items-start relative z-10">
            <!-- Left Side: Info -->
            <div class="space-y-8 text-center md:text-left">
                <div>
                    <h2 class="text-4xl md:text-6xl font-black text-white mb-6 leading-tight tracking-tighter uppercase">Parlons de <br><span class="text-blue-500 italic">vos projets.</span></h2>
                    <p class="text-slate-400 text-lg leading-relaxed">Besoin d'un conseil expert ou d'une assistance technique ? Notre équipe est à votre écoute 24/7.</p>
                </div>
                
                <div class="space-y-6">
                    <div class="flex items-center gap-4 justify-center md:justify-start group">
                        <div class="w-12 h-12 glass rounded-2xl flex items-center justify-center text-blue-500 group-hover:bg-blue-600 group-hover:text-white transition-all">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <span class="font-bold text-slate-200">contact@gomoney.com</span>
                    </div>
                    <div class="flex items-center gap-4 justify-center md:justify-start group">
                        <div class="w-12 h-12 glass rounded-2xl flex items-center justify-center text-blue-500 group-hover:bg-blue-600 group-hover:text-white transition-all">
                            <i class="fa-solid fa-phone"></i>
                        </div>
                        <span class="font-bold text-slate-200">+212 522 00 00 00</span>
                    </div>
                </div>
            </div>

            <!-- Right Side: Form Card -->
            <div class="glass p-8 md:p-10 rounded-[3rem] shadow-2xl border border-white/5">
                <div class="contact-details space-y-6">
                    <div class="space-y-2">
                        <label for="email" class="text-[10px] font-black text-blue-500 uppercase tracking-[0.2em] ml-2">Email Professionnel</label>
                        <input type="email" id="email" placeholder="nom@exemple.com" class="input-field w-full rounded-2xl px-6 py-4 text-white">
                    </div>
                    <div class="space-y-2">
                        <label for="message" class="text-[10px] font-black text-blue-500 uppercase tracking-[0.2em] ml-2">Votre Message</label>
                        <textarea id="message" placeholder="Comment pouvons-nous vous aider ?" class="input-field w-full rounded-2xl px-6 py-4 text-white h-32"></textarea>
                    </div>
                    <button class="btns w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-5 rounded-2xl uppercase tracking-[0.2em] text-xs transition-all transform hover:scale-[1.02] shadow-2xl shadow-blue-900/40 flex items-center justify-center gap-3">
                        Envoyer le message <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-12 border-t border-white/5 bg-[#0a101f] px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <p class="text-slate-600 text-[10px] font-bold uppercase tracking-[0.5em]">© 2024 GoMoney - Digital Experience</p>
            <div class="flex gap-8 text-slate-500 text-lg">
                <a href="#" title="Facebook" class="hover:text-blue-500 transition"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" title="Instagram" class="hover:text-blue-500 transition"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" title="LinkedIn" class="hover:text-blue-500 transition"><i class="fa-brands fa-linkedin"></i></a>
            </div>
        </div>
    </footer>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const closeBtn = document.getElementById('close-btn');
        const menu = document.getElementById('menu');

        menuBtn.onclick = () => menu.classList.remove('hidden');
        closeBtn.onclick = () => menu.classList.add('hidden');
    </script>
</body>
</html>
